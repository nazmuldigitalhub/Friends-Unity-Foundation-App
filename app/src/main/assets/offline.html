<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B6B3A">
    <title>Offline · Friends Unity Foundation</title>
    <style>
        :root {
            --brand: #0B6B3A;
            --brand-dark: #075028;
            --accent: #F4B223;
            --ink: #14231A;
            --muted: #5B6B61;
            --surface: #FFFFFF;
            --page: #EEF3EF;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 0%, rgba(11, 107, 58, 0.16), transparent 45%),
                radial-gradient(circle at 90% 100%, rgba(244, 178, 35, 0.18), transparent 40%),
                var(--page);
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 28px 32px;
            text-align: center;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(7, 80, 40, 0.14);
            animation: rise 0.45s ease-out both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
            line-height: 1;
            color: #FFFFFF;
            background: linear-gradient(145deg, var(--brand), var(--brand-dark));
            border-radius: 50%;
            box-shadow: 0 10px 24px rgba(11, 107, 58, 0.28);
        }

        .signal {
            width: 54px;
            height: 4px;
            margin: 0 auto 22px;
            border-radius: 999px;
            background: var(--accent);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
            line-height: 1.2;
            letter-spacing: -0.3px;
            color: var(--brand-dark);
        }

        p {
            margin: 0 auto;
            max-width: 320px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--muted);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 260px;
            min-height: 50px;
            margin: 28px auto 0;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
            background: var(--brand);
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover,
        button:focus-visible {
            background: var(--brand-dark);
            outline: none;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: default;
        }

        .hint {
            margin-top: 18px;
            font-size: 13px;
            color: #7A8A80;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --ink: #EAF3ED;
                --muted: #A9BDB1;
                --surface: #10241A;
                --page: #0A1711;
            }

            .card {
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
            }

            h1 {
                color: #FFFFFF;
            }
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <div class="logo" aria-hidden="true">F</div>
        <div class="signal" aria-hidden="true"></div>
        <h1>You're offline</h1>
        <p>Friends Unity Foundation needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
        <button id="retry" type="button">Retry</button>
        <p class="hint">Your connection will be restored as soon as you're back online.</p>
    </main>

    <script>
        (function () {
            var button = document.getElementById('retry');
            var defaultLabel = button.textContent;

            function retry() {
                button.disabled = true;
                button.textContent = 'Connecting…';

                try {
                    if (window.Android && typeof window.Android.retry === 'function') {
                        window.Android.retry();
                    } else {
                        window.location.href = 'https://friendsunityfoundation.org';
                    }
                } catch (error) {
                    window.location.href = 'https://friendsunityfoundation.org';
                }

                window.setTimeout(function () {
                    button.disabled = false;
                    button.textContent = defaultLabel;
                }, 3000);
            }

            button.addEventListener('click', retry);

            window.addEventListener('online', function () {
                if (window.Android && typeof window.Android.retry === 'function') {
                    window.Android.retry();
                }
            });
        })();
    </script>
</body>
</html>
